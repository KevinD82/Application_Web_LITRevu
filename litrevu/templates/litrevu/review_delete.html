{% extends 'authentication/base.html' %}

{% block title %}Supprimer la critique - LITRevu{% endblock %}

{% block content %}
<div class="main-container">
    <div class="auth-card" style="text-align: center; max-width: 500px; margin: 0 auto;">
        <h2>Supprimer la critique</h2>
        <p style="margin: 20px 0; color: var(--text-muted);">
            Êtes-vous sûr de vouloir supprimer votre critique <strong>"{{ review.headline }}"</strong> ?
        </p>

        <form method="post" style="display: flex; justify-content: center; gap: 15px;">
            {% csrf_token %}
            <button type="submit" class="btn-primary">Confirmer la suppression</button>
            <a href="{% url 'posts' %}" class="btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
