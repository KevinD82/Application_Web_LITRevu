{% extends 'authentication/base.html' %}

{% block title %}Mot de passe modifié - LITRevu{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 450px; text-align: center;">
        <h2>Mot de passe réinitialisé !</h2>
        <p style="color: var(--text-muted); margin: 1.5rem 0;">
            Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec vos nouveaux identifiants.
        </p>
        <a href="{% url 'login' %}" class="btn-primary" style="text-decoration: none; display: inline-block;">Se connecter</a>
    </div>
</div>
{% endblock %}
